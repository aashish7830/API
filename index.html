<!DOCTYPE html>
<html>
<head>
<title>GET API Example</title>
</head>
<body>

<h2>Users List</h2>

<button onclick="loadUsers()">
Load Users
</button>

<ul id="users"></ul>

<script>

async function loadUsers() {

const response =
await fetch(
'https://jsonplaceholder.typicode.com/users'
);

const users =
await response.json();

let output = '';

users.forEach(user => {

output += `
<li>
${user.name}
</li>
`;

});

document.getElementById('users')
.innerHTML = output;

}

</script>

</body>
</html>
